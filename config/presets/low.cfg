// frame pacing: never cap at the refresh rate (vsync/DXVK paces the frames)
fps_max 300
// network (standard community-server values)
rate 786432
cl_cmdrate 66
cl_updaterate 66
cl_interp 0
cl_interp_ratio 1
// low: lowest GPU cost
mat_picmip 1
r_rootlod 1
r_shadows 0
mat_reducefillrate 1
mat_antialias 0
mat_forceaniso 1
mat_hdr_level 0
r_waterforceexpensive 0
r_waterforcereflectentities 0
r_decals 200
