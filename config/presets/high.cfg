// frame pacing: never cap at the refresh rate (vsync/DXVK paces the frames)
fps_max 300
// network (standard community-server values)
rate 786432
cl_cmdrate 66
cl_updaterate 66
cl_interp 0
cl_interp_ratio 1
// high: everything on
mat_picmip 0
r_rootlod 0
r_shadows 1
mat_reducefillrate 0
mat_antialias 4
mat_forceaniso 8
mat_hdr_level 2
r_waterforceexpensive 1
r_waterforcereflectentities 1
r_decals 2048
mat_motion_blur_enabled 1
