// frame pacing: never cap at the refresh rate (vsync/DXVK paces the frames)
fps_max 300
// network (standard community-server values)
rate 786432
cl_cmdrate 66
cl_updaterate 66
cl_interp 0
cl_interp_ratio 1
// balanced: full textures and models, the costliest effects (AA, HDR, reflective water) off.
// Tuned on the M1 in phase 1 (docs/phase1-css-m1-report.md).
mat_picmip 0
r_rootlod 0
r_shadows 1
mat_reducefillrate 0
mat_antialias 0
mat_forceaniso 4
mat_hdr_level 0
r_waterforceexpensive 0
r_waterforcereflectentities 0
r_decals 1024
